name: Otomatik Film Botu

on:
  # Site izinli bir veri/API kaynağı sağlamadıkça otomatik tarama yapılmaz.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Modülleri Yükle
        run: pip install -r requirements.txt

      - name: Botu Çalıştır ve Filmleri Çek
        run: python bot.py

      # Çakışma Önleyici: Push işleminden önce Github'daki son hali çeker.
      - name: Çakışmaları Önle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Yeni Verileri GitHub'a Kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Otomatik Güncelleme: 9000+ Film Arşivi Eklendi"
          file_pattern: veritabani.json
